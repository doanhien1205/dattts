name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install Python packages
        run: pip install -r backend/requirements.txt pytest modal
      - name: Backend tests (without the speech model)
        working-directory: backend
        run: python -m pytest -q -m "not real"
      - name: Modal app imports
        working-directory: backend
        run: python -c "import modal_app"
      - name: Proxy function tests
        run: node scripts/test_proxy.mjs
      - name: Vietnamese static page is up to date
        run: node scripts/build_vi.mjs --check
      - name: CSP hashes match inline scripts
        run: python3 scripts/csp_hashes.py
      - name: Shell script syntax
        run: bash -n scripts/deploy_modal.sh scripts/deploy_pages.sh
